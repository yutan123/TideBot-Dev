name: tide_bot
description: "TideBot - 本地化沉浸式多模态 AI 伴侣 APP"
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 本地存储与极密底座
  sqflite: ^2.3.0
  shared_preferences: ^2.2.3
  # Keep the pre-migration Android bridge: newer Kotlin/JNI getAll bindings
  # can fail at runtime before any saved preferences can be read.
  shared_preferences_android: 2.4.25
  package_info_plus: ^8.3.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3

  # 网络与底层通信
  http: ^1.2.1
  http_parser: ^4.1.2
  # Office Open XML（docx/xlsx/pptx）离线正文提取
  archive: ^4.5.2
  yaml: ^3.1.3
  crypto: ^3.0.6
  quickjs_engine: 0.1.7
  tide_plugin_process:
    path: packages/tide_plugin_process

  # UI 特效与多模态交互
  flutter_svg: ^2.0.10
  liquid_glass_widgets: ^0.30.2
  rive: ^0.13.0
  webview_flutter: ^4.7.0
  # 6.x 的 Android 插件已声明 namespace，兼容 AGP 8+。
  record: ^6.1.1
  audioplayers: ^6.5.0
  heif_converter: ^1.0.7
  image: ^4.12.0
  image_picker: ^1.1.2
  video_player: ^2.10.1
  camera: ^0.11.0+2
  file_picker: ^8.0.5
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  html: ^0.15.4
  # Maintained Full GPL fork: available native artifacts and libx264 support.
  ffmpeg_kit_flutter_new: 4.6.7

  # 后台守护与保活
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^17.1.2

  path: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false # 我们只做安卓
  image_path: "assets/images/logo.png" # 指向你刚上传的 logo
  min_sdk_size: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/icons/
    - assets/emojitwo/
    - assets/skills/
    - assets/plugin_sdk.js
  fonts:
    - family: LogMono
      fonts:
        - asset: assets/fonts/LogMono.ttf
    - family: LogSansSC
      fonts:
        - asset: assets/fonts/LogSansSC.otf
          weight: 400
    - family: TideFont
      fonts:
        - asset: assets/fonts/LXGWMarkerGothic-Regular.ttf
        # 统一指向 Regular，防止因缺少 Bold 字体文件崩溃，Flutter 会自动加粗渲染
        - asset: assets/fonts/LXGWMarkerGothic-Regular.ttf
          weight: 700
